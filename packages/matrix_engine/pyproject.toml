[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# The distribution name is prefixed so it can never be confused with an unrelated
# public package of the same name. The import name stays `matrix_engine`.
name = "ponta-matrix-engine"
version = "0.1.0"
description = "Ponta Matrix: normalise, reconcile and fuse tracking data into one quality-scored dataset."
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "kloppy",
    "pyarrow",
]

[tool.setuptools.packages.find]
where = ["src"]
